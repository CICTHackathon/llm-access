# Policy regression scenarios. The simulator runs them on demand, and the verifier
# runs them against every candidate policy change: a change that flips one of
# these outcomes is rejected. Times are local to the site timezone.

scenarios:
  - name: employee in own lab on a weekday
    uid: "0xa1b2c3d4"
    door: door-1
    at: 2026-11-10T09:30:00
    expect: permit

  - name: employee in own lab late at night
    uid: "0xa1b2c3d4"
    door: door-1
    at: 2026-11-10T23:30:00
    expect: deny

  - name: employee of another department in the server room
    uid: "0xa1b2c3d4"
    door: door-2
    at: 2026-11-10T09:30:00
    expect: deny

  - name: administrator in the server room on Sunday night
    uid: "0xb2c3d4e5"
    door: door-2
    at: 2026-11-15T02:00:00
    expect: permit

  - name: contractor in the lab during business hours
    uid: "0xc3d4e5f6"
    door: door-1
    at: 2026-11-10T10:00:00
    expect: permit

  - name: contractor in the lab on Saturday
    uid: "0xc3d4e5f6"
    door: door-1
    at: 2026-11-14T10:00:00
    expect: deny

  - name: intern in the server room
    uid: "0xd4e5f607"
    door: door-2
    at: 2026-11-10T10:00:00
    expect: deny
    code: D-INTERN-SERVER-ROOM

  - name: suspended employee
    uid: "0xe5f60718"
    door: door-1
    at: 2026-11-10T10:00:00
    expect: deny
    code: subject_inactive

  - name: revoked card
    uid: "0xf6071829"
    door: door-1
    at: 2026-11-10T10:00:00
    expect: deny
    code: card_revoked
